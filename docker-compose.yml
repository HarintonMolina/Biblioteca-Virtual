services:
  web:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=sanjacinto;Username=sanjacinto;Password=${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}"
      BootstrapAdmin__Email: "${ADMIN_EMAIL:?Configura ADMIN_EMAIL en .env}"
      BootstrapAdmin__Password: "${ADMIN_PASSWORD:?Configura ADMIN_PASSWORD en .env}"
    volumes:
      - archivos:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sanjacinto
      POSTGRES_USER: sanjacinto
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}"
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanjacinto -d sanjacinto"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  datos:
  archivos:
